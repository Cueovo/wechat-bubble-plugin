name: Build RootHide Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Record runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          {
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            sw_vers
            xcodebuild -version
            echo "iphoneos_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            xcrun clang --version
          } | tee build-manifest.txt

      - name: Install build dependencies
        shell: bash
        run: brew install ldid xz dpkg

      - name: Install pinned Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          echo "theos_commit=$(git -C "$THEOS" rev-parse HEAD)" | tee -a build-manifest.txt
          brew list --versions ldid xz dpkg | tee -a build-manifest.txt

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          package_count="$(find packages -maxdepth 1 -type f -name '*.deb' -print | wc -l | tr -d ' ')"
          test "$package_count" -eq 1
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          dpkg-deb --info "$package" | tee package-info.txt
          dpkg-deb --contents "$package" | tee package-contents.txt
          grep -Fq 'Package: com.bi8bo.wechat.bubble' package-info.txt
          grep -Fq 'Architecture: iphoneos-arm64e' package-info.txt
          grep -Fq 'Library/MobileSubstrate/DynamicLibraries/WeChatBubble.dylib' package-contents.txt
          if grep -Fq 'var/jb/Library/MobileSubstrate/DynamicLibraries/WeChatBubble.dylib' package-contents.txt; then
            echo 'Unexpected ordinary rootless package path in RootHide artifact' >&2
            exit 1
          fi
          shasum -a 256 "$package" | tee SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wechat-bubble-roothide-${{ github.sha }}
          path: |
            packages/*.deb
            SHA256SUMS
            build-manifest.txt
            package-info.txt
            package-contents.txt
          if-no-files-found: error
          retention-days: 14
